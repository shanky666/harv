<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — HarvestLenz</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1><span>Harvest</span>Lenz</h1>
      <p class="subtitle">Create a new farmer account</p>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="farmer@example.com" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="phone" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="location" placeholder="Nashik, Maharashtra">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = 'Creating account...';
        await HarvestLenz.register({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          location: document.getElementById('location').value,
          password: document.getElementById('password').value
        });
        toast('Account created! Please sign in.');
        location.href = 'login.html';
      } catch (err) {
        toast(err.message, 'error');
        const btn = e.target.querySelector('button');
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    };
  </script>
</body>
</html>
