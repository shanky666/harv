<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HarvestLenz</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1><span>Harvest</span>Lenz</h1>
      <p class="subtitle">Sign in to your farmer account</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="farmer@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Sign In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
      <p class="auth-footer" style="margin-top:8px;"><a href="index.html">Continue as guest</a></p>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    if (HarvestLenz.isLoggedIn()) location.href = 'index.html';
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = 'Signing in...';
        await HarvestLenz.login(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        toast('Welcome back!');
        location.href = 'index.html';
      } catch (err) {
        toast(err.message, 'error');
        const btn = e.target.querySelector('button');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    };
  </script>
</body>
</html>
