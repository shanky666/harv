<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fruit Passport — HarvestLenz</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand"><a href="index.html" style="color:inherit;text-decoration:none;"><span>Harvest</span>Lenz</a></div>
    <div class="navbar-links">
      <a href="index.html">Dashboard</a>
      <button onclick="HarvestLenz.logout();location.href='login.html'" id="authBtn">Sign Out</button>
    </div>
  </nav>

  <div class="container" id="mainContent">
    <div style="text-align:center;padding:48px;"><div class="spinner" style="width:32px;height:32px;"></div><p style="margin-top:12px;color:var(--text-muted);">Loading AI Fruit Passport...</p></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const fruitId = qs('id');
    if (!fruitId) { location.href = 'index.html'; }

    async function load() {
      try {
        const data = await HarvestLenz.getPassport(fruitId);
        render(data);
      } catch (err) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">&#10060;</div>
            <p>Passport not found or server unavailable.</p>
            <p style="font-size:0.8rem;margin-top:8px;color:var(--text-dim);">${err.message}</p>
            <a href="index.html" class="btn btn-outline" style="margin-top:16px;">Back to Dashboard</a>
          </div>`;
      }
    }

    function render(d) {
      document.title = `Passport: ${d.fruit_type || 'Fruit'} — HarvestLenz`;

      const defects = (d.defects || 'None detected').split(',').map(s => s.trim()).filter(Boolean);

      document.getElementById('mainContent').innerHTML = `
        <div style="margin-bottom:24px;">
          <a href="javascript:history.back()" style="font-size:0.85rem;color:var(--text-muted);">&larr; Back to scan</a>
        </div>

        <div class="passport-container">
          <div class="passport-header">
            <div style="font-size:3rem;margin-bottom:8px;">&#127812;</div>
            <h1>${d.fruit_type || 'Unknown Fruit'}</h1>
            <p style="color:var(--text-muted);">AI Fruit Passport</p>
            <span class="badge ${HarvestLenz.gradeClass(d.grade)}" style="margin-top:12px;font-size:0.85rem;padding:6px 16px;">${d.grade || '-'}</span>
          </div>

          <div class="passport-grid" style="margin-bottom:24px;">
            <div class="passport-field">
              <div class="label">Passport ID</div>
              <div class="value" style="font-size:0.8rem;word-break:break-all;">${d.passport_id || fruitId}</div>
            </div>
            <div class="passport-field">
              <div class="label">Fruit Type</div>
              <div class="value">${d.fruit_type || '-'}</div>
            </div>
            <div class="passport-field">
              <div class="label">Grade</div>
              <div class="value"><span class="badge ${HarvestLenz.gradeClass(d.grade)}">${d.grade || '-'}</span></div>
            </div>
            <div class="passport-field">
              <div class="label">Shelf Life</div>
              <div class="value">${d.shelf_life || '-'}</div>
            </div>
            <div class="passport-field">
              <div class="label">Target Market</div>
              <div class="value">${d.market || '-'}</div>
            </div>
            <div class="passport-field">
              <div class="label">Created</div>
              <div class="value">${formatDate(d.created_at)}</div>
            </div>
          </div>

          <div class="card" style="margin-bottom:16px;">
            <div class="card-header"><h2>Detected Defects</h2></div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              ${defects.length ? defects.map(def => `
                <div style="padding:8px 14px;border-radius:20px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);font-size:0.85rem;color:var(--grade-medium);">
                  ${def}
                </div>
              `).join('') : '<p style="color:var(--text-muted);font-size:0.9rem;">No defects detected</p>'}
            </div>
          </div>

          <div class="card">
            <div class="card-header"><h2>Market Guidelines</h2></div>
            <div class="summary-row"><span class="label">Recommended Channel</span><span class="value">${d.market || '-'}</span></div>
            <div class="summary-row"><span class="label">Quality Assessment</span><span class="value">${d.grade || '-'}</span></div>
            <div class="summary-row"><span class="label">Estimated Shelf Life</span><span class="value">${d.shelf_life || '-'}</span></div>
          </div>
        </div>
      `;
    }

    load();
  </script>
</body>
</html>
